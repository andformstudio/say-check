<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Say It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Speak-and-check page for Arata's Word Pile. The text to practise arrives in the URL hash
   (#w=word&ex=example); nothing is stored or sent anywhere except the browser's own speech recognition. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#13242B; --muted:#5B6F72; --line:#D3DEDB;
  --accent:#0E7470; --accent-ink:#FFFFFF; --accent-soft:#D6ECE9;
  --marker:#F3C64B; --again:#B5452F; --again-soft:#F6DED7;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A1E; --surface:#16262B; --ink:#E6EFEC; --muted:#93A8A9; --line:#2A3E43;
  --accent:#4FC2B8; --accent-ink:#0B1C1E; --accent-soft:#1D3B3D;
  --marker:#E8B93A; --again:#F08B72; --again-soft:#3A2622;}}
:root[data-theme="dark"]{
  --bg:#0E1A1E; --surface:#16262B; --ink:#E6EFEC; --muted:#93A8A9; --line:#2A3E43;
  --accent:#4FC2B8; --accent-ink:#0B1C1E; --accent-soft:#1D3B3D;
  --marker:#E8B93A; --again:#F08B72; --again-soft:#3A2622;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1.05;margin:0}
h1 .hl{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 90%,transparent 90%);padding:0 .1em}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 .9rem var(--f-body);padding:8px 6px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.target{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.25;word-break:break-word;margin:0}
.target.long{font-size:1.3rem;line-height:1.4}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:16px 12px;font:700 1.05rem var(--f-body);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn svg{width:20px;height:20px}
.btn.listen{background:var(--accent-soft);color:var(--accent)}
.btn.mic{background:var(--accent);color:var(--accent-ink)}
.btn.mic.on{background:var(--again);color:#fff}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{margin:0;font-size:.9rem;color:var(--muted);min-height:1.4em}
.result{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:14px}
.score{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.words{font-size:1.1rem;line-height:1.9}
.words b{font-weight:500;padding:1px 5px;border-radius:5px;margin-right:2px}
.words b.ok{background:var(--accent-soft);color:var(--accent)}
.words b.miss{background:var(--again-soft);color:var(--again);text-decoration:underline}
.heard{font-size:.85rem;color:var(--muted)}
details{font-size:.85rem;color:var(--muted)}
details input{margin-top:8px;width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.foot{color:var(--muted);font-size:.78rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Say <span class="hl">It</span></h1>
  <div class="tabs" id="tabs" hidden>
    <button type="button" data-k="w" aria-pressed="true">Word</button>
    <button type="button" data-k="ex" aria-pressed="false">Example</button>
  </div>
  <div class="card" id="card"></div>
  <p class="foot">終わったら、このタブを閉じて単語帳に戻ってください。</p>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const p = new URLSearchParams(location.hash.slice(1));
  const texts = { w: (p.get("w") || "").replace(/[~〜]/g, "").trim(), ex: (p.get("ex") || "").trim() };
  let key = p.get("k") === "ex" && texts.ex ? "ex" : (texts.w ? "w" : "ex");
  let result = null, msg = "", listening = false, rec = null;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canTalk = "speechSynthesis" in window;
  const SPEAK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

  // words that came through in order are green, the rest red (longest common subsequence)
  const norm = s => String(s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/[’‘]/g, "'")
    .replace(/[^\p{L}\p{N}'\s]/gu, " ").split(/\s+/).map(x => x.replace(/^'+|'+$/g, "")).filter(Boolean);
  function judge(target, heard){
    const t = norm(target), h = norm(heard);
    const dp = Array.from({length: t.length + 1}, () => new Array(h.length + 1).fill(0));
    for (let i = t.length - 1; i >= 0; i--) for (let j = h.length - 1; j >= 0; j--)
      dp[i][j] = t[i] === h[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    const ok = new Set(); let i = 0, j = 0;
    while (i < t.length && j < h.length){
      if (t[i] === h[j]){ ok.add(i); i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++;
    }
    return { words: t, ok, heard, score: t.length ? Math.round(100 * ok.size / t.length) : 0 };
  }

  function speak(text, rate){
    if (!canTalk) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate || .9; speechSynthesis.speak(u); } catch(e){}
  }

  function render(){
    const text = texts[key];
    $("tabs").hidden = !(texts.w && texts.ex);
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
    if (!text){ $("card").innerHTML = '<div class="empty">練習する文がありません。単語帳のカードから開いてください。</div>'; return; }
    let h = '<p class="target' + (text.length > 28 ? ' long' : '') + '" lang="en">' + esc(text) + '</p>' +
      '<div class="row">' +
      (canTalk ? '<button class="btn listen" id="listen">' + SPEAK_SVG + 'Listen</button>' : '') +
      (SR ? '<button class="btn mic' + (listening ? ' on' : '') + '" id="mic">' + MIC_SVG + (listening ? 'Listening…' : 'Speak') + '</button>' : '') +
      '</div><p class="msg" aria-live="polite">' + esc(msg) + '</p>';
    if (result){
      const m = result.score === 100 ? "Perfect! 完璧" : result.score >= 70 ? "Good! 赤い単語をもう一度" : "Try again. もう一度ゆっくり";
      h += '<div class="result" aria-live="polite"><div class="score">' + result.score + '% · ' + m + '</div>' +
        '<div class="words">' + result.words.map((x, k) => '<b class="' + (result.ok.has(k) ? 'ok' : 'miss') + '">' + esc(x) + '</b>').join(" ") + '</div>' +
        '<div class="heard">Heard: “' + esc(result.heard) + '”</div></div>';
    }
    h += '<details' + (SR ? '' : ' open') + '><summary>マイクが使えないとき</summary>' +
      '<input id="typed" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここをタップして、キーボードの🎤で言う → Enter"></details>';
    $("card").innerHTML = h;
    if ($("listen")) $("listen").onclick = () => speak(text);
    if ($("mic")) $("mic").onclick = () => listen(text);
    $("typed").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()){ e.preventDefault(); result = judge(text, e.target.value); msg = ""; render(); } };
  }

  function listen(text){
    if (rec){ try { rec.stop(); } catch(e){} return; }
    try {
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 3;
      let got = false;
      rec.onresult = e => {
        // keep the alternative closest to the target, so one odd guess doesn't fail a good try
        let best = null;
        Array.from(e.results[0] || []).forEach(a => { const r = judge(text, a.transcript); if (!best || r.score > best.score) best = r; });
        if (best){ got = true; result = best; msg = ""; }
      };
      rec.onerror = e => {
        if (["not-allowed", "service-not-allowed"].includes(e.error)) msg = "マイクが許可されていません。Safari の設定でマイクを許可してください。";
        else if (e.error === "audio-capture") msg = "マイクが見つかりません。";
        else if (e.error === "no-speech") msg = "聞こえませんでした。もう一度どうぞ。";
      };
      rec.onend = () => { rec = null; listening = false; if (!got && !msg) msg = "聞こえませんでした。もう一度どうぞ。"; render(); };
      rec.start(); listening = true; msg = "どうぞ、英語で言ってください。"; render();
    } catch(e){ rec = null; listening = false; msg = "このブラウザでは音声認識が使えません。下の欄を使ってください。"; render(); }
  }

  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.k === key) return;
    key = b.dataset.k; result = null; msg = ""; if (rec) try { rec.abort(); } catch(_){} render();
  });
  // a new card opened into the same tab only changes the hash: start over with its text
  addEventListener("hashchange", () => location.reload());
  render();
})();
</script>
</body>
</html>
